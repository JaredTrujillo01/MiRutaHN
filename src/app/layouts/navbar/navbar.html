<header class="navbar">
  <nav class="nav-container" aria-label="Navegación principal">
    <button class="logo" type="button" (click)="scrollTo('hero')" aria-label="Ir al inicio">
      <i class="material-icons" aria-hidden="true">directions_bus</i>
      MiRutaHN
    </button>

    <section class="nav-menu" aria-label="Secciones principales">
      <button type="button" (click)="scrollTo('hero')">Inicio</button>
      <button type="button" (click)="scrollTo('beneficios')">Beneficios</button>
      <button type="button" (click)="scrollTo('como-funciona')">Cómo funciona</button>
      <button type="button" (click)="scrollTo('contacto')">Contacto</button>
    </section>

    <aside class="nav-actions" aria-label="Acceso a la plataforma">
      <button class="btn-portal" type="button" routerLink="/dashboard">
        Entrar a MiRutaHN
      </button>
    </aside>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-controls="menu-mobile"
      aria-label="Abrir o cerrar menú"
    >
      <i class="material-icons" aria-hidden="true">
        {{ menuOpen ? 'close' : 'menu' }}
      </i>
    </button>
  </nav>

  <nav
    id="menu-mobile"
    class="nav-mobile"
    [class.open]="menuOpen"
    aria-label="Navegación móvil"
  >
    <button type="button" (click)="scrollTo('hero')">
      <i class="material-icons" aria-hidden="true">home</i>
      Inicio
    </button>

    <button type="button" (click)="scrollTo('beneficios')">
      <i class="material-icons" aria-hidden="true">star</i>
      Beneficios
    </button>

    <button type="button" (click)="scrollTo('como-funciona')">
      <i class="material-icons" aria-hidden="true">info</i>
      Cómo funciona
    </button>

    <button type="button" (click)="scrollTo('contacto')">
      <i class="material-icons" aria-hidden="true">mail</i>
      Contacto
    </button>

    <button class="btn-portal-mobile" type="button" routerLink="/dashboard" (click)="closeMenu()">
      Entrar a MiRutaHN
    </button>
  </nav>
</header>
