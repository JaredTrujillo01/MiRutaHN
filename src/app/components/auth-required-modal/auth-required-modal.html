@if (visible()) {
  <section
    class="modal-backdrop"
    role="presentation"
    aria-hidden="false"
  >
    <article
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="auth-modal-title"
      aria-describedby="auth-modal-description"
    >
      <button
        class="modal-close"
        type="button"
        (click)="cerrarModal()"
        aria-label="Cerrar ventana"
      >
        <i class="material-icons" aria-hidden="true">close</i>
      </button>

      <section class="modal-icon" aria-hidden="true">
        <i class="material-icons" aria-hidden="true">lock</i>
      </section>

      <h2 id="auth-modal-title">
        {{ titulo() }}
      </h2>

      <p id="auth-modal-description">
        {{ mensaje() }}
      </p>

      <div
        class="modal-actions"
        role="group"
        aria-label="Opciones de autenticación"
      >
        <a
          routerLink="/login"
          class="btn-primary"
          (click)="cerrarModal()"
          aria-label="Ir a iniciar sesión"
        >
          Iniciar sesión
        </a>

        <a
          routerLink="/registro"
          class="btn-secondary"
          (click)="cerrarModal()"
          aria-label="Ir a registrarse"
        >
          Registrarse
        </a>
      </div>
    </article>
  </section>
}
