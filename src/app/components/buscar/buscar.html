<section class="formulario-busqueda" aria-labelledby="buscar-title">
  <header class="form-header">
    <section>
      <i class="material-icons" aria-hidden="true">travel_explore</i>
      <h2 id="buscar-title">Buscar ruta</h2>
      <p>Ingresa tu origen, destino y horario.</p>
    </section>

    <button class="btn-cancelar" type="button" (click)="cancelar.emit()" aria-label="Cerrar búsqueda">
      <i class="material-icons" aria-hidden="true">close</i>
    </button>
  </header>

  <fieldset class="form-grid">
    <legend class="sr-only">Datos de búsqueda</legend>

    <section class="campo">
      <label for="origen">Origen</label>

      <section class="campo-input">
        <i class="material-icons" aria-hidden="true">my_location</i>

        <input
          id="origen"
          name="origen"
          type="text"
          placeholder="Colonia Miraflores"
          [ngModel]="origen()"
          (ngModelChange)="origen.set($event)"
        />
      </section>
    </section>

    <section class="campo">
      <label for="destino">Destino</label>

      <section class="campo-input">
        <i class="material-icons" aria-hidden="true">location_on</i>

        <input
          id="destino"
          name="destino"
          type="text"
          placeholder="Ej: City Mall, Centro, UNAH..."
          [ngModel]="destino()"
          (ngModelChange)="destino.set($event)"
        />
      </section>
    </section>

    <section class="campo campo-horario">
      <label for="horario">Horario</label>

      <section class="campo-input">
        <i class="material-icons" aria-hidden="true">schedule</i>

        <select
          id="horario"
          name="horario"
          [ngModel]="horario()"
          (ngModelChange)="horario.set($event)"
        >
          <option>Ahora</option>
          <option>En 15 min</option>
          <option>En 30 min</option>
          <option>En 1 hora</option>
        </select>
      </section>
    </section>
  </fieldset>

  <button class="btn-buscar" type="button" (click)="enviarBusqueda()">
    Buscar ruta
    <i class="material-icons" aria-hidden="true">arrow_forward</i>
  </button>
</section>
