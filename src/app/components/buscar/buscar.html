<div class="formulario-busqueda">
  <div class="form-header">
    <button class="btn-cancelar" (click)="cancelar.emit()">✕</button>
  </div>

  <div class="campo">
    <label>ORIGEN</label>
    <input type="text" placeholder="Colonia Miraflores" value="Colonia Miraflores">
  </div>

  <div class="campo">
    <label>DESTINO</label>
    <input type="text" placeholder="¿A dónde vas?">
  </div>

  <div class="campo">
    <label>HORARIO</label>
    <select>
      <option>Ahora</option>
      <option>En 15 min</option>
      <option>En 30 min</option>
      <option>En 1 hora</option>
    </select>
  </div>

  <button class="btn-buscar" (click)="buscar.emit()">Buscar Ruta</button>
</div>
