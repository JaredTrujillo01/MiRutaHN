<main class="dashboard">
  <app-sidebar></app-sidebar>

  <section class="main-content" aria-labelledby="explorar-title">
    <h1 id="explorar-title" class="sr-only">Explorar rutas de MiRutaHN</h1>

    @if (paso() !== 4) {
      <section class="map-shell" aria-label="Mapa interactivo de rutas">
        <section
          #mapaExplorar
          class="mapa-principal"
          aria-label="Mapa de rutas aprobadas"
        ></section>

        @if (paso() === 1) {
          <section class="top-overlay" aria-label="Búsqueda rápida">
            <button class="search-box" type="button" (click)="abrirBusqueda()">
              <i class="material-icons" aria-hidden="true">search</i>
              <span>¿A dónde vamos hoy? Buscar destino...</span>
            </button>
          </section>
        }

        @if (paso() === 2) {
          <section class="flow-overlay" aria-label="Formulario de búsqueda de rutas">
            <app-buscar
              (buscar)="buscarRutas($event)"
              (cancelar)="cancelarBusqueda()"
            ></app-buscar>
          </section>
        }

        @if (paso() === 3) {
          <section class="flow-overlay flow-results" aria-label="Resultados de búsqueda">
            <app-buscar
              (buscar)="buscarRutas($event)"
              (cancelar)="cancelarBusqueda()"
            ></app-buscar>

            <app-resultados-busqueda
              [rutas]="rutasFiltradas()"
              [cargando]="cargandoRutas()"
              [termino]="terminoBusqueda()"
              (verDetalle)="verDetalle($event)"
              (volver)="abrirBusqueda()"
            ></app-resultados-busqueda>
          </section>
        }
      </section>
    }

    @if (paso() === 4) {
      <section class="detalle-page" aria-label="Detalle de ruta seleccionada">
        <section class="detalle-map-card" aria-label="Mapa de la ruta seleccionada">
          <section #mapaDetalle class="mapa-detalle"></section>
        </section>

        <aside class="detalle-panel" aria-label="Información de la ruta">
          <app-detalle-ruta
            [ruta]="rutaSeleccionada()"
            (volver)="volverAResultados()"
          ></app-detalle-ruta>
        </aside>
      </section>
    }
  </section>
</main>
