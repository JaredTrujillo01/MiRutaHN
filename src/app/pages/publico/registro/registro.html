<div class="registro-page">

  <section class="registro-image">
    <div class="image-overlay">

      <div class="image-text">
        <h1>Transformando el transporte en Honduras.</h1>

        <p>
          Únete a la red más grande de movilidad inteligente y accede
          a rutas optimizadas para tu día a día.
        </p>
      </div>

    </div>
  </section>

  <section class="registro-content">

    <div class="registro-card">

      <h2>MiRutaHN</h2>

      <h1>Crea tu cuenta gratuita</h1>

      <p>
        Accede a las registradas y reportes en tiempo real.
      </p>

      <form>

        <label>Nombre completo</label>
        <input type="text" placeholder="Ej. Juan Pérez" />

        <div class="row">

          <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" placeholder="email@ejemplo.com" />
          </div>

          <div class="input-group">
            <label>Teléfono</label>
            <input type="text" placeholder="+504 9999-9999" />
          </div>

        </div>

        <label>Ciudad</label>

        <select>
          <option>Seleccione tu ciudad</option>
          <option>Tegucigalpa</option>
          <option>San Pedro Sula</option>
          <option>La Ceiba</option>
        </select>

        <label>Contraseña</label>
        <input type="password" placeholder="********" />

        <div class="terms">
          <input type="checkbox" />
          <span>
            Acepto los <a href="#">Términos y Condiciones</a>
          </span>
        </div>

        <button type="submit">
          Crear Cuenta →
        </button>

      </form>

      <div class="login-link">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Iniciar Sesión</a>
      </div>

    </div>

  </section>

</div>
